services:
  # Laravel App with PHP-FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        PHP_VERSION: ${PHP_VERSION:-7.4}
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gestok-network

  # Nginx
  web:
    image: nginx:alpine
    restart: always
    ports:
      - "8082:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - gestok-network

  # Postgres
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gestok}
      POSTGRES_USER: ${DB_USERNAME:-gestok}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gestok_change_me}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - gestok-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gestok} -d ${DB_DATABASE:-gestok}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gestok-network

networks:
  gestok-network:
    driver: bridge

volumes:
  gestok-db-data:
    driver: local

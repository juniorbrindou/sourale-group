version: '3.8'

services:
  # Laravel App with PHP-FPM
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: gestok-app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - gestok-network

  # Nginx
  web:
    image: nginx:alpine
    container_name: gestok-web
    restart: always
    ports:
      - "8082:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - gestok-network

  # Postgres
  db:
    image: postgres:alpine
    container_name: gestok-db
    restart: always
    environment:
      POSTGRES_DB: sourale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - gestok-db-data:/var/lib/postgresql/data
    networks:
      - gestok-network

networks:
  gestok-network:
    driver: bridge

volumes:
  gestok-db-data:
    driver: local
